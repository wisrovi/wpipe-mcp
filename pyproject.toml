[project]
name = "wpipe-mcp"
version = "0.1.0"
description = "MCP Server for WPipe Architecting"
dependencies = [
    "mcp[cli]>=1.0.0",
    "fastmcp>=0.1.0",
    "pydantic>=2.0.0"
]

[project.scripts]
wpipe-mcp = "wpipe_mcp.server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
